name: CI & Deploy

# Une seule branche pour l'instant : tout push sur main déclenche
# tests -> build -> déploiement. Les pull requests sont testées sans être
# déployées.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un déploiement à la fois : si deux push s'enchaînent, le plus ancien est
# annulé plutôt que de déployer une version dépassée après la récente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Build du site
        run: npm run build
      - name: Build du fichier HTML autonome
        run: npm run build:singlefile
      # Le fichier autonome est récupérable depuis l'onglet Actions de chaque
      # exécution — pratique pour l'envoyer à quelqu'un sans déployer.
      - name: Publier le fichier autonome
        uses: actions/upload-artifact@v4
        with:
          name: boite-a-rythmes-fichier-unique
          path: dist-singlefile/index.html

  deploy:
    name: Déploiement Vercel
    # `needs` fait de ce job une étape bloquée par les tests : si un test
    # échoue, rien n'est déployé.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest
      - name: Récupérer la configuration du projet
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build de production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Déployer
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url" >> "$GITHUB_STEP_SUMMARY"
