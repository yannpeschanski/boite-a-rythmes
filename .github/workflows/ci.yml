name: CI & Deploy

# Une seule branche pour l'instant : tout push sur main déclenche
# tests -> build -> déploiement. Les pull requests sont testées sans être
# déployées.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bouton « Run workflow » dans l'onglet Actions : permet de relancer un
  # déploiement sans avoir à modifier le code (ex. après avoir renouvelé le
  # jeton Vercel).
  workflow_dispatch:

# Un déploiement à la fois : si deux push s'enchaînent, le plus ancien est
# annulé plutôt que de déployer une version dépassée après la récente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Build du site
        run: npm run build
      - name: Build du fichier HTML autonome
        run: npm run build:singlefile
      # Le fichier autonome est récupérable depuis l'onglet Actions de chaque
      # exécution — pratique pour l'envoyer à quelqu'un sans déployer.
      - name: Publier le fichier autonome
        uses: actions/upload-artifact@v5
        with:
          name: boite-a-rythmes-fichier-unique
          path: dist-singlefile/index.html

  deploy:
    name: Déploiement Vercel
    # `needs` fait de ce job une étape bloquée par les tests : si un test
    # échoue, rien n'est déployé.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Tant que Vercel n'est pas configuré, on saute le déploiement au lieu
      # d'échouer : le dépôt reste vert (les tests, eux, sont bien passés) et
      # le résumé explique quoi faire.
      - name: Vercel est-il configuré ?
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Déploiement ignoré"
              echo
              echo "Vercel n'est pas encore configuré sur ce dépôt."
              echo "Lance \`bash scripts/setup-deploy.sh\` pour créer le projet"
              echo "et enregistrer les secrets, puis repousse."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Installer la CLI Vercel
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - name: Récupérer la configuration du projet
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build de production
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Déployer
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url" >> "$GITHUB_STEP_SUMMARY"
