name: CI & Deploy

# Tout push sur main déclenche tests -> build -> déploiement en production.
#
# ⚠️ Une pull request déclenche une PRÉVERSION, sur une URL à elle. Ce n'est pas
# un confort : sans elle, RIEN n'était testable ailleurs que sur le site en
# ligne. Le seul artefact récupérable était le fichier HTML autonome — et ouvert
# en `file://`, ce n'est pas un contexte sécurisé, donc `DeviceOrientationEvent`
# refuse la permission et le capteur d'inclinaison ne marche pas. C'est la
# raison, restée non nommée pendant trois audits, pour laquelle « le Mode Live
# n'a jamais été essayé sur un vrai téléphone » : ce n'était pas un oubli,
# c'était un empêchement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bouton « Run workflow » dans l'onglet Actions : permet de relancer un
  # déploiement sans avoir à modifier le code (ex. après avoir renouvelé le
  # jeton Vercel).
  workflow_dispatch:

# Un déploiement à la fois : si deux push s'enchaînent, le plus ancien est
# annulé plutôt que de déployer une version dépassée après la récente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Build du site
        run: npm run build
      - name: Build du fichier HTML autonome
        run: npm run build:singlefile
      # Le fichier autonome est récupérable depuis l'onglet Actions de chaque
      # exécution — pratique pour l'envoyer à quelqu'un sans déployer.
      - name: Publier le fichier autonome
        uses: actions/upload-artifact@v5
        with:
          name: boite-a-rythmes-fichier-unique
          path: dist-singlefile/index.html

  preview:
    name: Préversion Vercel
    # Même garde que la production : rien n'est publié si un test échoue.
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pour écrire l'URL en commentaire sur la pull request.
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Même repli que la production : Vercel non configuré -> on saute, on
      # n'échoue pas.
      - name: Vercel est-il configuré ?
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Préversion ignorée — Vercel n'est pas configuré." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Installer la CLI Vercel
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest
      # `--environment=preview`, et le build SANS `--prod` : c'est toute la
      # différence avec le job du dessous. L'URL produite est propre à cette
      # exécution, le site en ligne n'est pas touché.
      - name: Récupérer la configuration du projet
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build de préversion
        if: steps.check.outputs.ready == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Déployer la préversion
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Préversion : $url" >> "$GITHUB_STEP_SUMMARY"
      # Le commentaire est MIS À JOUR, jamais empilé : une PR qui reçoit dix
      # pushes ne doit pas porter dix commentaires identiques.
      - name: Publier l'URL sur la pull request
        if: steps.check.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marqueur = '<!-- preversion-vercel -->';
            const corps = [
              marqueur,
              '### 📱 Préversion',
              '',
              `${process.env.URL}`,
              '',
              'À ouvrir sur un téléphone : c’est en HTTPS, donc le capteur',
              'd’inclinaison du Mode Live peut demander sa permission — ce que',
              'le fichier autonome ouvert en local ne permet pas.',
            ].join('\n');
            const { data: existants } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const ancien = existants.find((c) => c.body && c.body.includes(marqueur));
            if (ancien) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ancien.id,
                body: corps,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: corps,
              });
            }

  deploy:
    name: Déploiement Vercel
    # `needs` fait de ce job une étape bloquée par les tests : si un test
    # échoue, rien n'est déployé.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Tant que Vercel n'est pas configuré, on saute le déploiement au lieu
      # d'échouer : le dépôt reste vert (les tests, eux, sont bien passés) et
      # le résumé explique quoi faire.
      - name: Vercel est-il configuré ?
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Déploiement ignoré"
              echo
              echo "Vercel n'est pas encore configuré sur ce dépôt."
              echo "Lance \`bash scripts/setup-deploy.sh\` pour créer le projet"
              echo "et enregistrer les secrets, puis repousse."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Installer la CLI Vercel
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest
      - name: Récupérer la configuration du projet
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build de production
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Déployer
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url" >> "$GITHUB_STEP_SUMMARY"
