<!doctype html>
<meta charset="utf-8">
<title>Mode Live — séquenceur compact, visualiseur en dessous</title>
<!--
  « je l'aurais réduit un peu car en soi, le séquenceur est surtout un visuel
  qui ne se joue pas […] on peut retirer des colonnes, on n'est pas
  contraints. Je ne réduirais donc pas la taille du pad ni des boutons. Il y
  aurait alors une place en dessous pour un visuel dynamique. » — Yann.

  Disposition RENDUE à l'identique : boutons 260 · colonne centrale 300 ·
  pad 260. Le séquenceur ne prend que le haut de la colonne centrale, le
  visualiseur reprend sa place en dessous.

  ⚠️ CE QUE LA MESURE DIT, ET QUI N'EST PAS INTUITIF : dans une colonne de
  300 px, la piste utile fait 219 px. À 16 colonnes, le carré est plafonné à
  11,7 px PAR LA LARGEUR — réduire la hauteur du séquenceur n'y change rien.
  Seul le nombre de colonnes fait grandir le carré.
-->
<style>
  :root {
    --amp-bg-1: #4b4b57; --amp-bg-2: #2e2e38; --amp-bg-3: #1e1e26;
    --amp-line: #0a0a10; --amp-white: #7d7d92;
    --amp-title-grad: linear-gradient(180deg, #3a3a8c 0%, #2f2f74 40%, #1c1c46 55%, #33337e 100%);
    --amp-lcd-bg: #050806; --amp-lcd: #2ee23c; --amp-lcd-dim: #0f5c17;
    --amp-amber: #ffd54a; --amp-text: #c8c8d8;
    --k: #d84315; --s: #c8881a; --h: #2b8a8a; --cl: #3fae54; --sh: #22a6c9;
    --ba: #6a7bff; --pa: #b06bff; --me: #ff6bd6;
  }
  body { margin: 0; padding: 28px; background: #14141a;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--amp-text); }
  .cap { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; color: #9aa0a6; }
  .cap b { color: #e8e8ff; font-size: 13px; }
  .cap span { display: block; margin-top: 3px; font-size: 10.5px; color: #7f858b; letter-spacing: .02em; }
  .board { width: 844px; height: 390px; margin: 0 0 34px;
    background: linear-gradient(180deg, var(--amp-bg-1), var(--amp-bg-2) 12%, var(--amp-bg-3));
    display: grid; grid-template-rows: auto auto auto 1fr; gap: 4px; padding: 6px;
    box-sizing: border-box; border: 1px solid #000; }

  .titlebar { display: flex; align-items: center; gap: 6px; height: 16px; padding: 2px 6px;
    background: var(--amp-title-grad); border: 1px solid var(--amp-line);
    border-radius: 3px 3px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .grip { width: 16px; align-self: stretch;
    background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.2px); background-size: 3px 3px; }
  .app-name { flex: 1; text-align: center; font-size: 8px; font-weight: 700; letter-spacing: .1em;
    color: #e8e8ff; text-shadow: 0 1px 1px rgba(0,0,0,.5); }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 1px; background: rgba(255,255,255,.5); }

  .topbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: var(--amp-lcd-bg); border: 1px solid var(--amp-line); border-radius: 4px;
    box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
  .btn { font-family: inherit; font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
    color: var(--amp-text); padding: 6px 9px; border-radius: 4px; border: 1px solid var(--amp-line);
    background: linear-gradient(180deg, var(--amp-white), var(--amp-bg-2) 50%, var(--amp-bg-3));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 3px rgba(0,0,0,.35); white-space: nowrap; }
  .lcdblock { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .lcd { color: var(--amp-lcd); font-size: 11px; letter-spacing: .03em;
    text-shadow: 0 0 4px rgba(53,224,122,.5); white-space: nowrap; }
  .lcd-sub { color: var(--amp-lcd-dim); font-size: 7px; letter-spacing: .05em; }

  .strip { display: flex; align-items: stretch; gap: 3px; height: 44px; padding: 3px;
    box-sizing: border-box; background: var(--amp-lcd-bg); border: 1px solid var(--amp-line);
    border-radius: 4px; box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
  .cases { flex: 1; display: flex; gap: 3px; min-width: 0; }
  .cases > .case { flex: 1 1 0; min-width: 0; }
  .case { position: relative; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; border-radius: 3px;
    border: 1px solid var(--amp-line);
    background: linear-gradient(180deg, #3c3c48, var(--amp-bg-2) 55%, var(--amp-bg-3));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  .case .nom { position: relative; z-index: 2; font-size: 9px; font-weight: 700; letter-spacing: .06em; }
  .case .n { position: relative; z-index: 2; font-size: 8px; color: #8e8ea3; }
  .case.on { border-color: var(--amp-amber); }
  .case.on .nom { color: #fff3cf; }
  .case .fill { position: absolute; left: 0; top: 0; bottom: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(255,213,74,.42), rgba(255,213,74,.16));
    border-right: 2px solid var(--amp-amber); box-shadow: 0 0 6px rgba(255,213,74,.5); }
  .case.done { opacity: .55; }
  .strip .tools { display: flex; gap: 3px; flex: none; }
  .strip .tools .btn { display: flex; align-items: center; font-size: 8.5px; padding: 0 8px; }
  .strip .tools .btn.next { color: #fff3cf; border-color: #6b5a20; }

  /* Disposition RENDUE : rien n'est repris au pad ni aux boutons. */
  .main { display: grid; grid-template-columns: 260px 1fr 260px; gap: 6px; }
  .pads { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px; opacity: .34; }
  .pad-btn { border-radius: 5px; border: 1px solid var(--amp-line);
    background: linear-gradient(180deg, var(--amp-white), var(--amp-bg-2) 50%, var(--amp-bg-3));
    display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .mid { display: flex; flex-direction: column; gap: 6px; min-height: 0; }

  .seq { display: flex; flex-direction: column; gap: 2px; padding: 3px; box-sizing: border-box;
    background: #0b0b10; border: 1px solid var(--amp-line); border-radius: 4px; flex: none; }
  .ligne { display: flex; align-items: center; gap: 3px; border-radius: 3px;
    padding: 2px; box-sizing: border-box;
    background: linear-gradient(180deg, #33333e, #262630);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset -1px -1px 0 #0a0a10; }
  .ligne .pastille { flex: none; width: 5px; height: 5px; border-radius: 50%; margin-right: 4px; }
  .ligne .nom { flex: none; width: 56px; font-size: 8.5px; font-weight: 700;
    letter-spacing: .07em; color: var(--amp-text); }
  .piste { position: relative; flex: 1; height: 100%; min-width: 0; }
  .piste i { position: absolute; top: 50%; border-radius: 2px;
    transform: translate(-50%, -50%); background: rgba(255,255,255,.10); }
  .piste i.tete { background: #eafff0 !important; box-shadow: 0 0 5px rgba(234,255,240,.6); }
  .piste u { position: absolute; top: 1px; bottom: 1px; width: 1px; background: rgba(255,255,255,.08); }
  .ligne.mute { background: #16161c;
    box-shadow: inset 1px 1px 0 #0a0a10, inset -1px -1px 0 rgba(255,255,255,.10); }
  .ligne.mute .nom { color: var(--amp-amber); text-decoration: line-through; opacity: .8; }
  .ligne.mute .pastille { background: #2a2a34 !important; }
  .ligne.mute .piste i { background: rgba(255,255,255,.06) !important; box-shadow: none !important; }

  /* ---- le visualiseur retrouve sa place ---- */
  .viz { position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid var(--amp-line); border-radius: 4px; background: #06060b;
    box-shadow: inset 0 0 8px rgba(0,0,0,.8); }
  .viz .lbl { position: absolute; top: 3px; left: 5px; z-index: 2; font-size: 7px;
    letter-spacing: .1em; color: var(--amp-lcd-dim); }
  .barres { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; padding: 3px; }
  .barres i { flex: 1; position: relative; border-radius: 1px 1px 0 0;
    background: linear-gradient(180deg, var(--k), var(--amp-amber) 42%, var(--h)); }
  .barres i::after { content: ''; position: absolute; left: 0; right: 0; top: -4px;
    height: 1px; background: #c8c8d8; }

  .padxy { position: relative; overflow: hidden; border: 1px solid var(--amp-line);
    border-radius: 8px; background: linear-gradient(145deg, var(--amp-bg-2), var(--amp-bg-3));
    box-shadow: inset 0 2px 8px rgba(0,0,0,.7);
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 20% 20%; }
  .thumb { position: absolute; width: 26px; height: 26px; border-radius: 50%;
    left: 58%; top: 40%; transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #9fe8b6, #2f9a56);
    box-shadow: 0 0 10px rgba(53,224,122,.55), inset 0 -2px 4px rgba(0,0,0,.4); }
</style>

<div id="planche"></div>

<script>
  const L = {
    kick:   { nom: 'KICK',    c: 'var(--k)',  n: 16, on: [0,4,8,10,14],        tete: 8 },
    snare:  { nom: 'CAISSE',  c: 'var(--s)',  n: 16, on: [4,12],               tete: 8 },
    hat:    { nom: 'CHARLEY', c: 'var(--h)',  n: 16, on: [0,2,4,6,8,10,12,14], tete: 8 },
    clap:   { nom: 'CLAP',    c: 'var(--cl)', n: 16, on: [4,12],               tete: 8 },
    shaker: { nom: 'SHAKER',  c: 'var(--sh)', n: 16, on: [1,3,5,7,9,11,13,15], tete: 8 },
    bass:   { nom: 'BASSE',   c: 'var(--ba)', n: 8,  on: [0,3,4,6],            tete: 4 },
    pad:    { nom: 'NAPPE',   c: 'var(--pa)', n: 4,  on: [0,1,2,3],            tete: 2 },
    melody: { nom: 'MÉLODIE', c: 'var(--me)', n: 16, on: [0,2,5,7,8,11,13],    tete: 8 },
  };

  // [id, titre, lignes, hauteur de ligne, colonnes affichées (0 = résolution
  //  réelle de chaque ligne), lignes coupées]
  const V = [
    ['P1', 'Résolution réelle — 16 colonnes', ['kick','snare','hat','bass','pad','melody'], 26, 0, ['hat']],
    ['P2', 'Résumé en croches — 8 colonnes',  ['kick','snare','hat','bass','pad','melody'], 26, 8, ['hat']],
    ['P3', 'Le pire cas — 8 lignes, résolution réelle', ['kick','snare','hat','clap','shaker','bass','pad','melody'], 22, 0, ['hat','shaker']],
  ];

  const strip = `<div class="strip"><div class="cases">
    <div class="case done"><span class="nom">INTRO</span><span class="n">×2</span></div>
    <div class="case done"><span class="nom">COUPLET</span><span class="n">×4</span></div>
    <div class="case on"><span class="fill" style="width:50%"></span><span class="nom">REFRAIN</span><span class="n">×4</span></div>
    <div class="case"><span class="nom">COUPLET</span><span class="n">×4</span></div>
    <div class="case"><span class="nom">REFRAIN</span><span class="n">×4</span></div>
    <div class="case"><span class="nom">PONT</span><span class="n">×2</span></div>
    <div class="case"><span class="nom">REFRAIN</span><span class="n">×8</span></div>
    <div class="case"><span class="nom">OUTRO</span><span class="n">×2</span></div>
    </div><div class="tools"><span class="btn next">SUIVANT ▸</span><span class="btn">TENIR</span></div></div>`;

  const boutons = `<div class="pads"><span class="pad-btn">BREAK</span><span class="pad-btn">FILL</span>
    <span class="pad-btn">CHAOS</span><span class="pad-btn">ROLL K</span>
    <span class="pad-btn">ROLL S</span><span class="pad-btn">ROLL H</span></div>`;

  const barres = Array.from({ length: 22 }, (_, i) =>
    '<i style="height:' + (14 + Math.round(78 * Math.abs(Math.sin(i * 0.9 + 1)) * (1 - i / 36))) + '%"></i>').join('');

  document.getElementById('planche').innerHTML = V.map(([id, titre, lignes, rowH, cols, mutes]) => {
    const corps = lignes.map((k) => {
      const d = L[k];
      return '<div class="ligne' + (mutes.includes(k) ? ' mute' : '') + '" style="height:' + rowH + 'px" data-k="' + k + '" data-cols="' + cols + '">' +
        '<span class="pastille" style="background:' + d.c + '"></span>' +
        '<span class="nom">' + d.nom + '</span><span class="piste"></span></div>';
    }).join('');
    return `<p class="cap"><b>${id} — ${titre}</b><span class="mesure" data-for="${id}"></span></p>
      <div class="board" id="b-${id}">
        <div class="titlebar"><span class="grip"></span><span class="app-name">BOÎTE À RYTHMES — LIVE</span><span class="dots"><i></i><i></i><i></i></span></div>
        <div class="topbar"><span class="btn">■ STOP</span><span class="btn">⏺ REC</span>
          <span class="lcdblock"><span class="lcd">120 BPM · LECTURE · REFRAIN · TOUR 2/4</span>
          <span class="lcd-sub">${lignes.length} LIGNES · ${mutes.length} COUPÉE${mutes.length > 1 ? 'S' : ''} · TAPE UNE LIGNE POUR LA COUPER</span></span>
          <span class="btn">TILT</span><span class="btn">⚙</span></div>
        ${strip}
        <div class="main">
          ${boutons}
          <div class="mid">
            <div class="seq">${corps}</div>
            <div class="viz"><span class="lbl">BARRES · ARTY · RUN</span><div class="barres">${barres}</div></div>
          </div>
          <div class="padxy"><div class="thumb"></div></div>
        </div>
      </div>`;
  }).join('');

  document.querySelectorAll('.board').forEach((board) => {
    const lignes = [...board.querySelectorAll('.ligne')];
    const rowH = lignes[0].getBoundingClientRect().height;
    const pisteW = lignes[0].querySelector('.piste').getBoundingClientRect().width;
    const forceCols = +lignes[0].dataset.cols;
    // Une taille par écran : commandée par la ligne la plus dense affichée,
    // puis plafonnée par la hauteur de ligne.
    const nMax = forceCols || Math.max(...lignes.map((l) => L[l.dataset.k].n));
    const s = Math.max(5, Math.min(pisteW / nMax - 2, rowH - 8));
    lignes.forEach((l) => {
      const d = L[l.dataset.k];
      const p = l.querySelector('.piste');
      // En mode résumé, une case = une croche : allumée si l'un des pas
      // qu'elle recouvre sonne. C'est un RÉSUMÉ, pas le motif.
      const n = forceCols ? Math.min(forceCols, d.n) : d.n;
      const facteur = d.n / n;
      let h = '';
      for (let i = 4; i < n; i += Math.max(1, Math.round(n / 4))) h += '<u style="left:' + (i / n * 100) + '%"></u>';
      for (let i = 0; i < n; i++) {
        const actif = d.on.some((x) => Math.floor(x / facteur) === i);
        const tete = Math.floor(d.tete / facteur) === i;
        h += '<i class="' + (tete ? 'tete' : '') + '" style="left:' + ((i + 0.5) / n * 100) +
          '%;width:' + s + 'px;height:' + s + 'px' + (actif ? ';background:' + d.c : '') + '"></i>';
      }
      p.innerHTML = h;
    });
    const lgd = document.querySelector('.mesure[data-for="' + board.id.slice(2) + '"]');
    if (lgd) lgd.textContent = 'Carré ' + s.toFixed(1) + ' px · ligne ' + rowH.toFixed(0) +
      ' px (la cible du mute) · séquenceur ' + board.querySelector('.seq').getBoundingClientRect().height.toFixed(0) +
      ' px · visualiseur ' + board.querySelector('.viz').getBoundingClientRect().height.toFixed(0) +
      ' px · pad ' + board.querySelector('.padxy').getBoundingClientRect().width.toFixed(0) + ' px (inchangé)';
  });
</script>
