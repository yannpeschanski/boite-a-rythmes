<!doctype html>
<meta charset="utf-8">
<title>Maquette H — Cahier de rythme</title>
<link rel="stylesheet" href="common.css">
<style>
  /* DIRECTION H — cahier de rythme. La seule proposition qui ne cite aucune
     machine : papier, réglure, encre. Elle s'adresse à l'autre moitié du
     produit — « une campagne pour apprendre le rythme à l'oreille ». Un pas
     n'est pas une diode, c'est une note posée sur une portée.
     Personne dans la revue de marché ne fait ça. */
  :root {
    --paper: #f6f1e4; --paper-2: #efe8d6; --rule: #cfc4a8; --rule-2: #e2d9c1;
    --ink: #23201a; --ink-soft: #6a6153; --red: #b4342a;
    --kick:#9c3b1f; --snare:#a8791b; --hat:#2f6f6c; --clap:#3d7a45; --shaker:#2a6e86;
  }
  body { background: var(--paper);
         background-image: repeating-linear-gradient(0deg, transparent 0 27px, var(--rule-2) 27px 28px);
         color: var(--ink); font: 14px Georgia, 'Iowan Old Style', serif;
         padding: 22px 18px 24px; }

  h1 { font-size: 21px; font-weight: 400; font-style: italic; letter-spacing: -.01em;
       margin-bottom: 2px; }
  .sub { font-size: 11px; color: var(--ink-soft); letter-spacing: .1em;
         text-transform: uppercase; font-family: Georgia, serif;
         border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
  .sub span { float: right; }

  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
  .bar b { border: 1.5px solid var(--ink); border-radius: 2px; padding: 9px 16px;
           font: 400 14px Georgia, serif; background: var(--paper-2); }
  .bar .tempo { margin-left: auto; font-size: 13px; color: var(--ink-soft); font-style: italic; }
  .bar .tempo em { font-style: normal; font-size: 17px; color: var(--ink); }

  .tabs { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px;
          border-bottom: 1px solid var(--rule); padding-bottom: 7px; }
  .tabs span { color: var(--ink-soft); }
  .tabs span.on { color: var(--ink); font-weight: 700;
                  box-shadow: 0 8px 0 -6px var(--red); }

  /* Mesures et temps : la réglure verticale porte l'information, pas un bandeau. */
  .staff { position: relative; }
  .ticks { display: flex; margin-left: 68px; margin-bottom: 6px; }
  .ticks span { flex: 1; font-size: 11px; color: var(--ink-soft);
                border-left: 1px solid var(--rule); padding-left: 5px; font-style: italic; }

  .line { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .name { width: 58px; flex: none; font-size: 12px; font-variant: small-caps;
          letter-spacing: .06em; text-align: right; }
  .notes { flex: 1; display: flex; gap: 6px; height: 38px;
           border-bottom: 1px solid var(--rule); }
  /* Note posée = pleine à l'encre. Silence = contour fin. Jamais un bouton. */
  .notes i { flex: 1; border: 1px solid var(--rule); border-radius: 1px;
             background: transparent; }
  .notes i.on { background: currentColor; border-color: currentColor; }
  .line.mute .name { color: var(--ink-soft); font-style: italic; }

  .note { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--rule);
          font-size: 12px; color: var(--ink-soft); font-style: italic; line-height: 1.6; }
  .note b { font-style: normal; color: var(--ink); font-variant: small-caps; }
</style>

<h1>Boîte à rythmes</h1>
<div class="sub">Cahier de rythme<span>mesure 4/4</span></div>

<div class="bar">
  <b>▶ Lecture</b><b>Break</b>
  <span class="tempo">tempo <em>120</em></span>
</div>

<div class="tabs"><span class="on">Rythme</span><span>Synthé</span><span>Production</span></div>

<div class="staff">
  <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span></div>

  <div class="line" style="color:var(--kick)">
    <span class="name">Kick</span>
    <span class="notes"><i class="on"></i><i></i><i class="on"></i><i></i></span>
  </div>
  <div class="line" style="color:var(--snare)">
    <span class="name">Snare</span>
    <span class="notes"><i></i><i class="on"></i><i></i><i class="on"></i></span>
  </div>
  <div class="line" style="color:var(--hat)">
    <span class="name">Hat</span>
    <span class="notes"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
  </div>
  <div class="line mute" style="color:var(--clap)">
    <span class="name">Clap</span>
    <span class="notes"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="line mute" style="color:var(--shaker)">
    <span class="name">Shaker</span>
    <span class="notes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </div>
</div>

<div class="note"><b>Kick</b> — ton 42, déclin 220&nbsp;ms, réverbération 12&nbsp;%.
  Le kick tombe sur le premier et le troisième temps&nbsp;: c'est l'appui de la mesure.</div>
